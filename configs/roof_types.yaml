# Roof-type classifier (not SegFormer). Isolated from tree/orchard checkpoints.
# Train on Bonn OSM roof:shape chips; infer on a building-footprint shapefile.

model:
  name: resnet50
  image_size: 224
  id2label:
    0: gabled
    1: flat
    2: skillion
    3: hipped
    4: gambrel
    5: half-hipped
    6: pyramidal
    7: mansard

train:
  batch_size: 32
  epochs: 12
  learning_rate: 3.0e-4
  weight_decay: 0.01
  num_workers: 0
  seed: 42
  early_stopping_patience: 4
  checkpoint_dir: outputs/checkpoints/roof_types

infer:
  buffer_m: 4.0
  min_side_px: 16
